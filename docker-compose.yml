services:
  # PostgreSQL Database for Odoo and n8n
  postgres:
    image: postgres:16-alpine
    container_name: postgres_invoice_automation
    environment:
      POSTGRES_USER: odoo
      # Local-dev default. Acceptable only because every published port below is bound to 127.0.0.1.
      # Change it (here, in the odoo service, and in .env) before any real deployment.
      POSTGRES_PASSWORD: odoopass123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First start of an EMPTY volume only: creates n8n_db + invoice_automation_logs and loads init.sql
      # into the latter. Existing volumes are not touched.
      - ./docker/initdb/00-databases-and-schema.sql:/docker-entrypoint-initdb.d/00-databases-and-schema.sql:ro
      - ./init.sql:/schema/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"	
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice_network
    restart: unless-stopped

  # Odoo ERP Platform
  odoo:
    image: odoo:17.0
    container_name: odoo_invoice_automation
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: odoopass123
      DB_PORT_5432_TCP_ADDR: postgres
      DB_PORT_5432_TCP_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - odoo_addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    ports:
      - "127.0.0.1:8069:8069"
    networks:
      - invoice_network
    restart: unless-stopped
    command: odoo --db_host=postgres --db_port=5432 --db_user=odoo --db_password=odoopass123 --database=odoo

  # CloudFlared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    command: tunnel --no-autoupdate run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    networks:
      - invoice_network
    restart: unless-stopped
    depends_on:
      - n8n

  # n8n Automation Platform
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_invoice_automation
    environment:
      # Basic n8n settings
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE}
      N8N_HOST: n8n.tahatahirbutt.me
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://hooks.tahatahirbutt.me/
      N8N_SECURE_COOKIE: "true"
      N8N_EDITOR_BASE_URL: https://n8n.tahatahirbutt.me/
      N8N_PROXY_HOPS: "1"
      
      
      
      # PostgreSQL backend for n8n (optional, uses SQLite by default)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${N8N_DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_POSTGRESDB_PASSWORD}
      
      # Execution settings
      
      N8N_EXECUTION_MODE: regular  # Use 'queue' for production
      N8N_EXECUTION_TIMEOUT: 600   # 10 minutes
      N8N_EXECUTION_DATA_SAVE_ON_SUCCESS: "true"
      N8N_EXECUTION_DATA_SAVE_ON_FAILURE: "true"
      N8N_EXECUTION_DATA_SAVE_ON_ERROR: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_TRUST_PROXY: "true"
      PDF_LINK_SECRET: ${PDF_LINK_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      ODOO_USER: ${ODOO_USER}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      ODOO_URL: "http://odoo:8069"
      ODOO_DB: "odoo"
      
      # Logging
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: console
      
      # Timezone
      TZ: UTC
      
      # Security (update in production)
      N8N_USER_MANAGEMENT_DISABLED: "false"
      
      
      # Optional: Analytics
      N8N_ANALYTICS: "false"
      
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files_data:/files
    ports:
      - "127.0.0.1:5678:5678"   # cloudflared reaches n8n over the Docker network (n8n:5678), not this port
    networks:
      - invoice_network
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "n8n", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
  

  # Redis (Optional, for queue-based execution in production)
  # Uncomment this section if running n8n in queue mode
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis_invoice_automation
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - invoice_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

volumes:
  postgres_data:
    driver: local
  odoo_data:
    driver: local
  odoo_addons:
    driver: local
  n8n_data:
    driver: local
  n8n_files_data:
    driver: local  
  # redis_data:
  #   driver: local

networks:
  invoice_network:
    driver: bridge

# Usage:
# Detached:     docker compose up -d
# Logs:         docker compose logs -f n8n
# Stop:         docker compose down
# Full cleanup: docker compose down -v   (DELETES all data: Odoo, n8n and the audit log)